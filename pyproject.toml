[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfilter"
version = "0.1.0"
description = "Classify job postings by citizenship / export-control / clearance restrictions"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["httpx>=0.27"]

[project.scripts]
jobfilter = "jobfilter.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["jobfilter*"]

[tool.setuptools.package-data]
"jobfilter" = ["us_cities.tsv"]
"jobfilter.storage" = ["*.sql"]
"jobfilter.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real network (deselected by default: -m 'not live')",
]
addopts = "-m 'not live'"
